<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotebookLM -> Notion Formatter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.35rem;
      text-align: center;
      color: var(--accent);
      margin-top: 10px;
    }
    p.sub {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .hint {
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: monospace;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-action {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-action:hover { background: var(--accent-hover); }
    .btn-clear {
      background: #334155;
      color: #94a3b8;
      font-size: 0.9rem;
      padding: 10px;
    }
    .btn-clear:hover { background: #475569; color: var(--text); }
    #status {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 26px;
      color: var(--success);
      padding: 4px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NotebookLM ➔ Notion</h1>
    <p class="sub">100% processato in locale</p>

    <div class="hint">
      👉 Incolla nel riquadro: il testo verrà convertito con <strong>doppio dollaro ($$)</strong> e gli elenchi separati a capo, per poi essere <u>ricopiato subito</u>.
    </div>

    <textarea id="inputText" placeholder="Tieni premuto qui e fai 'Incolla'..." autofocus></textarea>

    <div id="status"></div>

    <div class="btn-group">
      <button class="btn-action" id="btnCopy">📋 Copia Testo</button>
      <button class="btn-clear" id="btnClear">Pulisci riquadro</button>
    </div>
  </div>

  <script>
    function fixForNotion(text) {
      if (!text) return "";

      let fixed = text;

      // 1. Converte formule inline: \(, \(, \), \) in DOPPIO DOLLARO $$ (necessario per Notion!)
      fixed = fixed.replace(/\\{1,2}\(/g, '$$$$').replace(/\\{1,2}\)/g, '$$$$');
      
      // 2. Converte formule a blocco: \[, \[ -> $$
      fixed = fixed.replace(/\\{1,2}\[/g, '$$$$').replace(/\\{1,2}\]/g, '$$$$');

      // 3. Sistema i titoli tipo "**2. Titolo**" trasformandoli in titoli Markdown veri "## Titolo"
      fixed = fixed.replace(/\*\*(\d+\..*?)\*\*/g, '## $1');

      // 4. Manda a capo i punti elenco schiacciati (es. "[4, 5]* **Legame" oppure "[5]* Legame")
      fixed = fixed.replace(/(\]|\))\s*[:.]?\s*\*+\s+/g, '$1\n\n* ');

      // 5. Linea vuota prima e dopo i separatori orizzontali ---
      fixed = fixed.replace(/\n?---\n?/g, '\n\n---\n\n');

      return fixed;
    }

    const textarea = document.getElementById('inputText');
    const statusDiv = document.getElementById('status');

    function copyText() {
      textarea.select();
      textarea.setSelectionRange(0, 999999);
      const ok = document.execCommand('copy');
      window.getSelection().removeAllRanges();
      if (ok) {
        statusDiv.innerText = "✅ Convertito e COPIATO negli appunti! Ora puoi incollare in Notion.";
      } else {
        statusDiv.innerText = "⚠️ Convertito! Usa il pulsante qui sotto per copiare.";
      }
    }

    // Al momento dell'incolla, converte e copia in automatico
    textarea.addEventListener('paste', () => {
      setTimeout(() => {
        textarea.value = fixForNotion(textarea.value);
        copyText();
      }, 50);
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      if (!textarea.value.trim()) {
        statusDiv.innerText = "Il riquadro è vuoto!";
        return;
      }
      textarea.value = fixForNotion(textarea.value);
      copyText();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      textarea.value = '';
      statusDiv.innerText = '';
      textarea.focus();
    });
  </script>
</body>
</html>
