<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotebookLM -> Notion Formatter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.35rem;
      text-align: center;
      color: var(--accent);
      margin-top: 10px;
    }
    p.sub {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      height: 240px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: monospace;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-copy {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-copy:hover { background: var(--accent-hover); }
    .btn-clear {
      background: #334155;
      color: #94a3b8;
      font-size: 0.9rem;
      padding: 10px;
    }
    .btn-clear:hover { background: #475569; color: var(--text); }
    #status {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 26px;
      color: var(--success);
      padding: 4px;
    }
    .hint {
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NotebookLM ➔ Notion</h1>
    <p class="sub">100% Offline e Locale</p>

    <div class="hint">
      👉 <strong>Basta incollare nel riquadro:</strong> il testo verrà <u>convertito e ricopiato automaticamente</u> negli appunti!
    </div>

    <textarea id="inputText" placeholder="Tieni premuto qui e fai 'Incolla'..." autofocus></textarea>

    <div id="status"></div>

    <div class="btn-group">
      <button class="btn-copy" id="btnManualCopy">📋 Ricopia negli Appunti</button>
      <button class="btn-clear" id="btnClear">Pulisci riquadro</button>
    </div>
  </div>

  <script>
    function fixForNotion(text) {
      if (!text) return "";
      
      // 1. Converte formule inline: \(, \(, \), \) -> $
      let fixed = text.replace(/\\{1,2}\(/g, '$').replace(/\\{1,2}\)/g, '$');
      
      // 2. Converte formule a blocco: \[ ... \] -> $$ ... $$
      fixed = fixed.replace(/\\{1,2}\[/g, '$$').replace(/\\{1,2}\]/g, '$$');

      // 3. Ripara elenchi puntati compressi/attaccati
      fixed = fixed.replace(/(\]|\d+)\s*[:.]?\s*\*\s+(\*\*)/g, '$1\n* $2');
      fixed = fixed.replace(/(\]|\d+|\))\s*[:.]?\s*\*\s+([A-Za-zÀ-ÿ])/g, '$1\n* $2');

      return fixed;
    }

    const textarea = document.getElementById('inputText');
    const statusDiv = document.getElementById('status');

    function setStatus(msg, isError = false) {
      statusDiv.style.color = isError ? '#f87171' : 'var(--success)';
      statusDiv.innerText = msg;
    }

    // Funzione universale di copia (funziona sia con Clipboard API che con fallback per file:// locale su mobile)
    async function copyToClipboard(text) {
      // Metodo 1: Clipboard API moderna
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          // Continua al fallback
        }
      }

      // Metodo 2: Fallback affidabile con execCommand (supportato ovunque anche senza HTTPS e su file://)
      try {
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, 999999); // Per mobile
        const successful = document.execCommand('copy');
        // Deseleziona
        window.getSelection().removeAllRanges();
        return successful;
      } catch (err) {
        return false;
      }
    }

    // Elaborazione automatica non appena viene incollato del testo!
    textarea.addEventListener('paste', (event) => {
      // Lasciamo che l'incolla si completi o gestiamolo direttamente
      setTimeout(async () => {
        const originalText = textarea.value;
        if (!originalText.trim()) return;

        const converted = fixForNotion(originalText);
        textarea.value = converted;

        const copied = await copyToClipboard(converted);
        if (copied) {
          setStatus("✅ Convertito e COPIATO negli appunti! Puoi incollare in Notion.");
        } else {
          setStatus("⚠️ Convertito! Clicca su 'Ricopia negli Appunti' qui sotto.");
        }
      }, 50);
    });

    // Se l'utente modifica o incolla in altro modo (input event)
    textarea.addEventListener('input', () => {
      if (textarea.value.includes('\(') || textarea.value.includes('\[')) {
        textarea.value = fixForNotion(textarea.value);
      }
    });

    // Pulsante manuale per ricopiare
    document.getElementById('btnManualCopy').addEventListener('click', async () => {
      if (!textarea.value.trim()) {
        setStatus("Il riquadro è vuoto!", true);
        return;
      }
      textarea.value = fixForNotion(textarea.value);
      const copied = await copyToClipboard(textarea.value);
      if (copied) {
        setStatus("✅ Copiato con successo negli appunti!");
      } else {
        setStatus("❌ Errore nella copia. Seleziona il testo manualmente.", true);
      }
    });

    // Pulisci
    document.getElementById('btnClear').addEventListener('click', () => {
      textarea.value = '';
      setStatus("");
      textarea.focus();
    });
  </script>
</body>
</html>
